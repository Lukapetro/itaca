<svg width="720" height="180" viewBox="0 0 720 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="itaca">
  <!-- dashed voyage line -->
  <path d="M40 128 C 140 96, 200 150, 300 118 S 470 70, 545 96" stroke="#9a8e7a" stroke-width="2" stroke-dasharray="1 9" stroke-linecap="round" fill="none"/>
  <!-- compass rose, small -->
  <g transform="translate(64,52)" stroke="#9a8e7a" stroke-width="1.5">
    <circle r="14" fill="none"/>
    <path d="M0 -14 L3 0 L0 14 L-3 0 Z" fill="#9a8e7a" stroke="none"/>
    <path d="M-14 0 H14 M-9 -9 L9 9 M-9 9 L9 -9" opacity="0.45"/>
  </g>
  <!-- the island -->
  <g transform="translate(560,84)">
    <path d="M-26 22 Q-30 10 -18 6 Q-12 -8 2 -6 Q16 -12 24 0 Q36 4 32 16 Q36 24 24 26 L-20 26 Q-28 26 -26 22 Z" fill="#2a2318" stroke="#9a8e7a" stroke-width="2"/>
    <path d="M2 -6 L2 -30 M2 -30 L20 -22 L2 -16" stroke="#e8a23d" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
    <path d="M-34 34 Q-20 28 0 34 T 44 34" stroke="#9a8e7a" stroke-width="1.5" opacity="0.5" fill="none"/>
    <path d="M-40 42 Q-24 36 -2 42 T 48 42" stroke="#9a8e7a" stroke-width="1.5" opacity="0.3" fill="none"/>
  </g>
  <!-- wordmark -->
  <text x="40" y="96" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="56" fill="#e8dfd0" letter-spacing="1">itaca</text>
  <text x="42" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#9a8e7a">every project is an Ithaca — come home in seconds</text>
</svg>
